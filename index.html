<!DOCTYPE html>
<html lang="ko" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>서든랩_SYSTEM [SEARCH.EXE]</title>
  <meta name="description" content="서든랩: ADVANCED TACTICAL ANALYSIS. SYSTEM_READY." />
  <meta name="keywords" content="서든어택, 서든랩, SuddenLab, Y2K, CYBER, ANALYTICS" />
  <meta name="author" content="서든랩 Research" />

  <!-- Google Fonts: VT323 (Pixel), Space Mono (Code), Press Start 2P (Retro Header) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap"
    rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'cursive'],
            screen: ['"VT323"', 'monospace'],
            code: ['"Space Mono"', 'monospace'],
          },
          colors: {
            acid: {
              green: '#ccff00',
              pink: '#ff00ff',
              cyan: '#00ffff',
            },
            metal: {
              silver: '#c0c0c0',
              dark: '#2d2d2d',
            }
          },
          boxShadow: {
            'hard': '4px 4px 0px 0px #000000',
            'hard-pink': '4px 4px 0px 0px #ff00ff',
            'hard-green': '4px 4px 0px 0px #ccff00',
            'hard-cyan': '4px 4px 0px 0px #00ffff',
          },
          animation: {
            'marquee': 'marquee 20s linear infinite',
            'blink': 'blink 1s step-end infinite',
            'crt-on': 'crt-on 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards',
            'scanline-sweep': 'scanline-sweep 0.5s ease-out forwards',
            'glitch-flash': 'glitch-flash 0.3s step-end forwards',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(-100%)' },
            },
            blink: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0' },
            },
            'crt-on': {
              '0%': { opacity: '0', transform: 'scaleY(0.005) scaleX(0.8)', filter: 'brightness(3) saturate(0)' },
              '20%': { opacity: '1', transform: 'scaleY(0.005) scaleX(1)', filter: 'brightness(3) saturate(0)' },
              '40%': { transform: 'scaleY(0.5) scaleX(1)', filter: 'brightness(1.5) saturate(0.5)' },
              '60%': { transform: 'scaleY(1.02) scaleX(1)', filter: 'brightness(1.2) saturate(0.8)' },
              '80%': { transform: 'scaleY(0.98) scaleX(1)', filter: 'brightness(1) saturate(1)' },
              '100%': { opacity: '1', transform: 'scaleY(1) scaleX(1)', filter: 'brightness(1) saturate(1)' },
            },
            'scanline-sweep': {
              '0%': { backgroundPosition: '0% -100%' },
              '100%': { backgroundPosition: '0% 200%' },
            },
            'glitch-flash': {
              '0%': { clipPath: 'inset(0 0 95% 0)', transform: 'translateX(-2px)' },
              '20%': { clipPath: 'inset(40% 0 30% 0)', transform: 'translateX(2px)' },
              '40%': { clipPath: 'inset(0 0 60% 0)', transform: 'translateX(-1px)' },
              '60%': { clipPath: 'inset(20% 0 0 0)', transform: 'translateX(1px)' },
              '80%': { clipPath: 'inset(0)', transform: 'translateX(0)' },
              '100%': { clipPath: 'inset(0)', transform: 'translateX(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Y2K GLOBAL STYLES */
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: 'Space Mono', monospace;
      overflow-x: hidden;
    }

    ::selection {
      background: #ff00ff;
      color: #fff;
    }

    /* CRT Grid Background */
    .bg-crt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image:
        linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: -2;
      pointer-events: none;
    }

    /* Scanline Overlay */
    .scanline-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2));
      background-size: 100% 4px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.15;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      background: #2d2d2d;
    }

    ::-webkit-scrollbar-thumb {
      background: #c0c0c0;
      border: 2px solid #000;
      box-shadow: inset -1px -1px 0px #555, inset 1px 1px 0px #fff;
    }

    /* Utilities */
    .text-shadow-neon {
      text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff;
    }

    .text-shadow-green {
      text-shadow: 0 0 5px #ccff00, 0 0 10px #ccff00;
    }

    .window-border {
      box-shadow: inset 1px 1px 0px #fff, inset -1px -1px 0px #555;
      border: 2px solid #c0c0c0;
      background: #c0c0c0;
    }

    .window-content {
      box-shadow: inset 2px 2px 0px #000, inset -2px -2px 0px #fff;
      background: #000;
    }

    /* ─── Logo Glitch Effect ─── */
    .glitch-logo {
      position: relative;
      display: inline-block;
      animation: logo-shift 4s ease-in-out infinite;
    }
    .glitch-logo::before,
    .glitch-logo::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
      pointer-events: none;
    }
    .glitch-logo::before {
      color: #ff00ff;
      z-index: -1;
      animation: logo-glitch 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
    }
    .glitch-logo::after {
      color: #00ffff;
      z-index: -2;
      animation: logo-glitch 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse both infinite;
    }

    @keyframes logo-glitch {
      0%   { transform: translate(0); }
      20%  { transform: translate(-2px, 2px); }
      40%  { transform: translate(-2px, -2px); }
      60%  { transform: translate(2px, 2px); }
      80%  { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    @keyframes logo-shift {
      0%, 85%, 100% { transform: skewX(0deg); }
      86% { transform: skewX(8deg); }
      87% { transform: skewX(-6deg); }
      88% { transform: skewX(0deg); }
      92% { transform: skewX(0deg); }
      93% { transform: skewX(-10deg) skewY(2deg); }
      94% { transform: skewX(6deg) skewY(-1deg); }
      95% { transform: skewX(0deg); }
    }

    /* ─── Retro CRT Card Reveal ─── */
    .crt-card {
      transform-origin: center center;
      will-change: transform, opacity, filter;
    }
    .crt-card.crt-hidden {
      opacity: 0;
      transform: scaleY(0.005) scaleX(0.8);
      filter: brightness(3) saturate(0);
    }
    .crt-card.crt-visible {
      animation: crt-on 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    /* Green phosphor sweep overlay */
    .crt-card.crt-visible::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(204, 255, 0, 0.15) 45%,
        rgba(204, 255, 0, 0.3) 50%,
        rgba(204, 255, 0, 0.15) 55%,
        transparent 100%
      );
      background-size: 100% 300%;
      animation: scanline-sweep 0.5s 0.3s ease-out forwards;
      background-position: 0% -100%;
      pointer-events: none;
      z-index: 2;
    }
    /* Brief green glow on border */
    .crt-card.crt-visible {
      box-shadow: 0 0 0px rgba(204, 255, 0, 0);
    }
    @keyframes crt-glow {
      0%   { box-shadow: 0 0 8px rgba(204, 255, 0, 0.6), inset 0 0 8px rgba(204, 255, 0, 0.1); }
      100% { box-shadow: 0 0 0px rgba(204, 255, 0, 0), inset 0 0 0px rgba(204, 255, 0, 0); }
    }
    .crt-card.crt-glow {
      animation: crt-on 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 crt-glow 0.8s 0.4s ease-out forwards;
    }
  </style>
